name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: macos
            artifact: apple-music-discord-presence-macos-arm64.zip
          - os: windows-latest
            platform: windows
            artifact: apple-music-discord-presence-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.platform == 'macos'
        run: npm run verify && ./scripts/package-macos.sh
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          npm run build:ts
          npm test
          Get-ChildItem native,packaging,scripts -Recurse -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
          }
          ./scripts/package-windows.ps1
          ./scripts/verify-windows-package.ps1 -Archive release/apple-music-discord-presence-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-package
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-package"
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="releases/$GITHUB_REF_NAME.md"
          test -f "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip --repo "$GITHUB_REPOSITORY" --title "Apple Music Discord Presence $GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
