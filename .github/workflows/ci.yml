name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: ./scripts/package-macos.sh
      - run: codesign --verify --deep --strict "release/apple-music-discord-presence-macos-arm64/Apple Music Discord Presence.app"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      - run: npm test
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem native,packaging -Recurse -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
          }
      - name: Validate Windows packaging
        shell: pwsh
        run: ./scripts/package-windows.ps1
